<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hra: Příchozí zpráva</title>

    <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="font/css/fontawesome.css">

<link rel="stylesheet" href="font/css/solid.css">   <link rel="stylesheet" href="font/css/regular.css"> <link rel="stylesheet" href="font/css/brands.css">  ```

    <script src="story/story.js"></script>
</head>

<body>

    <div class="main-container">

       <video id="bg-video" autoplay loop muted playsinline poster="image/bg1.jpg">
            <source src="video/video1.mp4" type="video/mp4">
        </video>
        <div class="background-scenerie"></div>

        <div class="fog-layer"></div>

        <img src="image/ruka.png" alt="Ruka držící telefon" class="hand-holding-phone">


        <div id="phone-container">
            
            <div class="phone-status-bar">
                <div class="phone-status-bar-row">
                   <span id="phone-time">19:41</span>
                   <span> <i class="fa-solid fa-battery-full"></i> 94%</span>
                </div>
            </div>

            <div class="global-tools-bar">
                 <button class="tool-btn" onclick="goHome()" title="Aplikace">
                    <i class="fa-solid fa-home"></i>
                         <button class="tool-btn" onclick="toggleDarkMode()" title="Přepnout tmavý režim">
                    <i class="fa-solid fa-moon" id="dark-mode-icon"></i>
                </button>
                <button class="tool-btn" onclick="toggleFullscreen()" title="Celá obrazovka (F11)">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <button class="tool-btn" id="music-toggle-btn" onclick="toggleMusic()" title="Přehrát/Pozastavit hudbu">
                    <i class="fa-solid fa-pause" id="music-icon"></i>
                </button>
                <button class="tool-btn" onclick="nextSong()" title="Přepnout na další skladbu">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="tool-btn tool-danger" onclick="resetGame()" title="Restartovat hru">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>

            <div id="view-home" class="screen" style="display: flex;">
                <div class="app-grid">
                    <div class="app-icon" onclick="openApp('view-contacts')">
                        <i class="fa-solid fa-comment-sms" style="background: #0084ff; color: white;"></i>
                        <span>Zprávy</span>
                    </div>
                    <div class="app-icon" onclick="openApp('view-instagram')">
                        <i class="fa-brands fa-instagram" style="background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white;"></i>
                        <span>Fotky</span>
                    </div>
                </div>
            </div>

            <div id="view-contacts" class="screen" style="display: none;">
               <div class="screen-header">
    <span>
        <span class="back-btn" onclick="goHome()">↩</span><i class="fa-regular fa-message back-btn" onclick="goHome()" title="Zpět na plochu"></i>Zprávy
    </span>
</div>
                <div class="contacts-list" id="contacts-container"></div>
            </div>

            <div id="view-chat" class="screen" style="display: none;">
                <div class="chat-header-bar">
                    <button class="back-btn" onclick="openContactsScreen()">
                  ↩
                    </button>
                    <div class="avatar chat-avatar" id="chat-header-avatar">?</div>
                    <div class="contact-name" id="chat-header-name">Jméno</div>
                </div>
                <div id="chat-box" onclick="skipTyping()"></div>
                <div id="controls"></div>
            </div>

            <div id="view-instagram" class="screen" style="display: none;">
                <div class="insta-header-bar">
                    <button class="back-btn" id="insta-back-btn" onclick="renderInstaProfiles()">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <div style="margin-left: 2px; font-weight: bold; letter-spacing: 0.5px;">Instagram</div>
                </div>
                <div id="insta-content" style="flex-grow: 1; overflow-y: auto; padding: 0;">
                </div>
            </div>

            <div class="phone-home-btn" onclick="goHome()" title="Zpět na plochu"></div>

        </div> </div> <script src="script.js"></script>

</body>

</html>
